name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: echo "y" | sdkmanager "ndk;27.2.12479018"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build APK
        run: ./build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dirtyfrag-apk
          path: dirtyfrag.apk
